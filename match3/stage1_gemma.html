<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Match 3</title>
    <style>
        :root {
            --bg-color: #e0f0ff;
            --border-thick: 5px solid #444;
            --border-thin: 1px solid #ccc;
            --cell-bg: #000;
            --text-white: #fff;
            --selected-border: #90ee90;
            --selected-bg: #006400;
            --option-border: #90ee90;
            --option-bg: #444;
            --invalid-border: #ffcccb;
            --invalid-bg: #8b0000;
        }

        body {
            background-color: var(--bg-color);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        #game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        #title-bar {
            background-color: #000;
            color: var(--text-white);
            border: var(--border-thick);
            width: 720px; /* (8*60) + 40 + 200 */
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            padding: 10px 0;
            margin-bottom: 40px;
            box-sizing: border-box;
        }

        #main-area {
            display: flex;
            gap: 40px;
            align-items: flex-start;
        }

        #game-board {
            display: grid;
            grid-template-columns: repeat(8, 60px);
            grid-template-rows: repeat(8, 60px);
            border: var(--border-thick);
            background-color: #000;
            position: relative;
        }

        .cell {
            width: 60px;
            height: 60px;
            border: var(--border-thin);
            box-sizing: border-box;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            position: relative;
        }

        .cell.selected {
            border-color: var(--selected-border);
            background-color: var(--selected-bg);
        }

        .cell.option {
            border-color: var(--option-border);
            background-color: var(--option-bg);
        }

        .cell.invalid {
            border-color: var(--invalid-border);
            background-color: var(--invalid-bg);
        }

        .token {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: 1px solid #fff;
            position: absolute;
            transition: top 0.4s ease, left 0.4s ease;
            pointer-events: none;
            box-sizing: border-box;
        }

        #sidebar {
            width: 200px;
            height: 480px; /* 8 * 60 */
            background-color: #000;
            color: var(--text-white);
            border: var(--border-thick);
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .sidebar-label {
            font-size: 18px;
        }

        #score-val.negative {
            color: #ffcccb;
        }

        #restart-btn {
            margin-top: auto;
            padding: 10px;
            cursor: pointer;
            background-color: #444;
            color: #fff;
            border: 1px solid #fff;
            font-size: 16px;
            transition: background 0.2s;
        }

        #restart-btn:hover {
            background-color: #666;
        }

        #overlay-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 48px;
            font-weight: bold;
            text-align: center;
            pointer-events: none;
            z-index: 10;
            white-space: nowrap;
        }

        .floating-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 48px;
            font-weight: bold;
            pointer-events: none;
            z-index: 5;
            animation: floatUp 2s linear forwards;
        }

        @keyframes floatUp {
            0% { transform: translate(-50%, -50%); opacity: 1; }
            100% { transform: translate(-50%, -200px); opacity: 0; }
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            pointer-events: none;
            z-index: 8;
            animation: particleExplode 0.6s ease-out forwards;
        }

        @keyframes particleExplode {
            0% { transform: translate(0, 0); opacity: 1; }
            100% { transform: translate(var(--tx), var(--ty)); opacity: 0; }
        }

        #game-board.red-border {
            border-color: #8b0000;
        }
    </style>
</head>
<body>

<div id="game-container">
    <div id="title-bar">MATCH 3</div>
    <div id="main-area">
        <div id="game-board"></div>
        <div id="sidebar">
            <div class="sidebar-label">Level: <span id="level-val">1</span></div>
            <div class="sidebar-label">Score: <span id="score-val">0</span></div>
            <div class="sidebar-label">Target: <span id="target-val">100</span></div>
            <button id="restart-btn">Restart</button>
        </div>
    </div>
    <div id="overlay-text"></div>
</div>

<script>
    const BOARD_SIZE = 8;
    const CELL_SIZE = 60;
    const TOKEN_SIZE = 50;
    const COLORS = {
        'red': '#ff0000',
        'green': '#00ff00',
        'blue': '#0000ff',
        'orange': '#ffa500',
        'yellow': '#ffff00',
        'pink': '#ffc0cb'
    };
    const COLOR_KEYS = Object.keys(COLORS);

    class Match3 {
        constructor() {
            this.board = [];
            this.score = 0;
            this.level = 1;
            this.threshold = 100;
            this.selected = null; // {r, c}
            this.inputLocked = false;
            this.chainMultiplier = 1;

            this.boardEl = document.getElementById('game-board');
            this.scoreEl = document.getElementById('score-val');
            this.levelEl = document.getElementById('level-val');
            this.targetEl = document.getElementById('target-val');
            this.overlayEl = document.getElementById('overlay-text');
            this.restartBtn = document.getElementById('restart-btn');

            this.init();
            this.restartBtn.onclick = () => this.resetGame();
        }

        init() {
            this.createGrid();
            this.fillBoard();
            this.render();
            this.updateSidebar();
        }

        createGrid() {
            this.boardEl.innerHTML = '';
            for (let r = 0; r < BOARD_SIZE; r++) {
                for (let c = 0; c < BOARD_SIZE; c++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    cell.dataset.r = r;
                    cell.dataset.c = c;
                    cell.onclick = () => this.handleCellClick(r, c);
                    this.boardEl.appendChild(cell);
                }
            }
        }

        fillBoard() {
            this.board = [];
            for (let r = 0; r < BOARD_SIZE; r++) {
                this.board[r] = [];
                for (let c = 0; c < BOARD_SIZE; c++) {
                    let color;
                    do {
                        color = COLOR_KEYS[Math.floor(Math.random() * COLOR_KEYS.length)];
                    } while (this.wouldCreateMatch(r, c, color));
                    this.board[r][c] = color;
                }
            }
        }

        wouldCreateMatch(r, c, color) {
            // Check horizontal
            if (c >= 2 && this.board[r][c-1] === color && this.board[r][c-2] === color) return true;
            // Check vertical
            if (r >= 2 && this.board[r-1][c] === color && this.board[r-2][c] === color) return true;
            return false;
        }

        render() {
            // Render cells
            const cells = this.boardEl.querySelectorAll('.cell');
            cells.forEach(cell => {
                const r = parseInt(cell.dataset.r);
                const c = parseInt(cell.dataset.c);
                cell.className = 'cell';
                
                if (this.selected && this.selected.r === r && this.selected.c === c) {
                    cell.classList.add('selected');
                } else if (this.selected && this.isNeighbor(r, c, this.selected.r, this.selected.c)) {
                    cell.classList.add('option');
                }
            });

            // Render tokens
            // We remove all tokens and recreate them to ensure they are synced with the array
            // but for animation, we should ideally move them. 
            // Let's use a map to track token elements.
            this.renderTokens();
        }

        renderTokens() {
            // To make animation work, we don't clear tokens every time.
            // Instead, we ensure tokens exist for each board cell.
            const currentTokens = document.querySelectorAll('.token');
            
            // This is a bit inefficient but ensures synchronization.
            // For production-quality, I'll track token elements in a 2D array.
        }

        // Better token management
        initTokens() {
            this.tokenEls = [];
            for (let r = 0; r < BOARD_SIZE; r++) {
                this.tokenEls[r] = [];
                for (let c = 0; c < BOARD_SIZE; c++) {
                    const token = document.createElement('div');
                    token.className = 'token';
                    this.boardEl.appendChild(token);
                    this.tokenEls[r][c] = token;
                    this.updateTokenPos(r, c);
                }
            }
        }

        updateTokenPos(r, c) {
            const token = this.tokenEls[r][c];
            token.style.top = `${r * CELL_SIZE + (CELL_SIZE - TOKEN_SIZE) / 2}px`;
            token.style.left = `${c * CELL_SIZE + (CELL_SIZE - TOKEN_SIZE) / 2}px`;
            token.style.backgroundColor = COLORS[this.board[r][c]];
        }

        isNeighbor(r1, c1, r2, c2) {
            return Math.abs(r1 - r2) + Math.abs(c1 - c2) === 1;
        }

        async handleCellClick(r, c) {
            if (this.inputLocked) return;

            if (this.selected) {
                if (this.isNeighbor(r, c, this.selected.r, this.selected.c)) {
                    await this.trySwap(this.selected.r, this.selected.c, r, c);
                } else {
                    this.selected = {r, c};
                }
            } else {
                this.selected = {r, c};
            }
            this.render();
        }

        async trySwap(r1, c1, r2, c2) {
            const color1 = this.board[r1][c1];
            const color2 = this.board[r2][c2];

            // Swap in data
            this.board[r1][c1] = color2;
            this.board[r2][c2] = color1;

            if (this.hasAnyMatch()) {
                this.inputLocked = true;
                this.selected = null;
                this.render();
                
                // Animate swap
                await this.animateSwap(r1, c1, r2, c2);
                
                await this.processMatches();
                await this.checkLevelAdvance();
                this.inputLocked = false;
                this.render();
                this.checkGameOver();
            } else {
                // Invalid move: flash red
                this.board[r1][c1] = color1;
                this.board[r2][c2] = color2;
                
                const cell1 = this.getCellEl(r1, c1);
                const cell2 = this.getCellEl(r2, c2);
                cell1.classList.add('invalid');
                cell2.classList.add('invalid');
                
                setTimeout(() => {
                    cell1.classList.remove('invalid');
                    cell2.classList.remove('invalid');
                    this.render();
                }, 300);
            }
        }

        animateSwap(r1, c1, r2, c2) {
            return new Promise(resolve => {
                // Swap the references in the array so we move the actual elements
                const temp = this.tokenEls[r1][c1];
                this.tokenEls[r1][c1] = this.tokenEls[r2][c2];
                this.tokenEls[r2][c2] = temp;
                
                this.updateTokenPos(r1, c1);
                this.updateTokenPos(r2, c2);
                
                setTimeout(resolve, 400);
            });
        }

        hasAnyMatch() {
            return this.findMatches().length > 0;
        }

        findMatches() {
            const matches = [];
            const matchedCells = new Set();

            // Horizontal
            for (let r = 0; r < BOARD_SIZE; r++) {
                for (let c = 0; c < BOARD_SIZE - 2; c++) {
                    const color = this.board[r][c];
                    if (color && color === this.board[r][c+1] && color === this.board[r][c+2]) {
                        let length = 3;
                        while (c + length < BOARD_SIZE && this.board[r][c + length] === color) {
                            length++;
                        }
                        matches.push({ r, c: 0, length, color, orientation: 'h', startC: c });
                        for (let i = 0; i < length; i++) matchedCells.add(`${r},${c+i}`);
                        c += length - 1;
                    }
                }
            }

            // Vertical
            for (let c = 0; c < BOARD_SIZE; c++) {
                for (let r = 0; r < BOARD_SIZE - 2; r++) {
                    const color = this.board[r][c];
                    if (color && color === this.board[r+1][c] && color === this.board[r+2][c]) {
                        let length = 3;
                        while (r + length < BOARD_SIZE && this.board[r + length][c] === color) {
                            length++;
                        }
                        matches.push({ r: 0, c, length, color, orientation: 'v', startR: r });
                        for (let i = 0; i < length; i++) matchedCells.add(`${r+i},${c}`);
                        r += length - 1;
                    }
                }
            }

            return matches;
        }

        async processMatches() {
            let matches = this.findMatches();
            if (matches.length === 0) {
                this.chainMultiplier = 1;
                return;
            }

            const isMultiMatch = matches.length > 1;
            const hasRed = matches.some(m => m.color === 'red');
            
            // Calculate score
            let matchPoints = 0;
            matches.forEach(m => {
                const length = m.length;
                const base = length + (length - 3);
                const points = m.color === 'red' ? -base : base;
                matchPoints += points;
            });

            matchPoints *= this.chainMultiplier;
            this.score += matchPoints;
            this.updateSidebar();

            // Feedback
            if (hasRed) {
                this.showOverlayText("OH NO!", "lightcoral");
                this.boardEl.classList.add('red-border');
                setTimeout(() => this.boardEl.classList.remove('red-border'), 500);
            } else {
                if (isMultiMatch) this.showOverlayText("MULTI-MATCH!", "rgba(255,255,255,0.7)");
                else if (this.chainMultiplier > 1) this.showOverlayText("NICE!", "rgba(255,255,255,0.7)");
                
                // Check for bonus (length > 3)
                const hasBonus = matches.some(m => m.length > 3);
                if (hasBonus && !hasRed) this.showOverlayText("BONUS!", "rgba(0,255,0,0.7)");
            }

            // Particles
            const matchedCells = new Set();
            matches.forEach(m => {
                if (m.orientation === 'h') {
                    for (let i = 0; i < m.length; i++) matchedCells.add({r: m.r, c: m.startC + i});
                } else {
                    for (let i = 0; i < m.length; i++) matchedCells.add({r: m.startR + i, c: m.c});
                }
            });
            
            // Corrected matchedCells logic
            const cellsToExplode = [];
            matches.forEach(m => {
                if (m.orientation === 'h') {
                    for (let i = 0; i < m.length; i++) cellsToExplode.push({r: m.r, c: m.startC + i});
                } else {
                    for (let i = 0; i < m.length; i++) cellsToExplode.push({r: m.startR + i, c: m.c});
                }
            });

            cellsToExplode.forEach(cell => this.createExplosion(cell.r, cell.c));

            // Remove tokens
            const matchedSet = new Set();
            matches.forEach(m => {
                if (m.orientation === 'h') {
                    for (let i = 0; i < m.length; i++) matchedSet.add(`${m.r},${m.startC + i}`);
                } else {
                    for (let i = 0; i < m.length; i++) matchedSet.add(`${m.startR + i},${m.c}`);
                }
            });

            matchedSet.forEach(coord => {
                const [r, c] = coord.split(',').map(Number);
                this.board[r][c] = null;
            });

            await this.animateRemoval();
            await this.applyGravity();
            
            this.chainMultiplier *= 2;
            await this.processMatches();
        }

        async animateRemoval() {
            return new Promise(resolve => {
                for (let r = 0; r < BOARD_SIZE; r++) {
                    for (let c = 0; c < BOARD_SIZE; c++) {
                        if (this.board[r][c] === null) {
                            this.tokenEls[r][c].style.opacity = '0';
                        }
                    }
                }
                setTimeout(resolve, 200);
            });
        }

        async applyGravity() {
            // Phase 1: Surviving tokens fall
            for (let c = 0; c < BOARD_SIZE; c++) {
                const survivingEls = [];
                const survivingColors = [];
                for (let r = 0; r < BOARD_SIZE; r++) {
                    if (this.board[r][c] !== null) {
                        survivingEls.push(this.tokenEls[r][c]);
                        survivingColors.push(this.board[r][c]);
                    }
                }

                const numSurviving = survivingColors.length;
                // Update board array (bottom part)
                for (let r = 0; r < BOARD_SIZE; r++) {
                    if (r < BOARD_SIZE - numSurviving) {
                        this.board[r][c] = null;
                    } else {
                        this.board[r][c] = survivingColors[r - (BOARD_SIZE - numSurviving)];
                    }
                }

                // Update tokenEls array (bottom part)
                for (let i = 0; i < numSurviving; i++) {
                    const r = BOARD_SIZE - numSurviving + i;
                    this.tokenEls[r][c] = survivingEls[i];
                }
            }

            // Animate survivors
            for (let r = 0; r < BOARD_SIZE; r++) {
                for (let c = 0; c < BOARD_SIZE; c++) {
                    if (this.board[r][c] !== null) {
                        this.updateTokenPos(r, c);
                        this.tokenEls[r][c].style.opacity = '1';
                    }
                }
            }
            await new Promise(resolve => setTimeout(resolve, 200));

            // Phase 2: New tokens drop in
            for (let c = 0; c < BOARD_SIZE; c++) {
                for (let r = 0; r < BOARD_SIZE; r++) {
                    if (this.board[r][c] === null) {
                        this.board[r][c] = COLOR_KEYS[Math.floor(Math.random() * COLOR_KEYS.length)];
                        const newToken = document.createElement('div');
                        newToken.className = 'token';
                        newToken.style.top = `-${TOKEN_SIZE}px`; 
                        newToken.style.left = `${c * CELL_SIZE + (CELL_SIZE - TOKEN_SIZE) / 2}px`;
                        this.boardEl.appendChild(newToken);
                        this.tokenEls[r][c] = newToken;
                    }
                }
            }

            // Animate new tokens
            for (let r = 0; r < BOARD_SIZE; r++) {
                for (let c = 0; c < BOARD_SIZE; c++) {
                    this.updateTokenPos(r, c);
                    this.tokenEls[r][c].style.opacity = '1';
                }
            }
            await new Promise(resolve => setTimeout(resolve, 200));
        }

        createExplosion(r, c) {
            const centerX = c * CELL_SIZE + CELL_SIZE / 2;
            const centerY = r * CELL_SIZE + CELL_SIZE / 2;
            const color = COLORS[this.board[r][c]] || '#fff';
            
            for (let i = 0; i < 40; i++) {
                const p = document.createElement('div');
                p.className = 'particle';
                p.style.left = `${centerX}px`;
                p.style.top = `${centerY}px`;
                p.style.backgroundColor = color;
                
                const angle = Math.random() * Math.PI * 2;
                const dist = Math.random() * 60 + 20;
                p.style.setProperty('--tx', `${Math.cos(angle) * dist}px`);
                p.style.setProperty('--ty', `${Math.sin(angle) * dist}px`);
                
                this.boardEl.appendChild(p);
                setTimeout(() => p.remove(), 600);
            }
        }

        showOverlayText(text, color) {
            const el = document.createElement('div');
            el.className = 'floating-text';
            el.textContent = text;
            el.style.color = color;
            this.boardEl.appendChild(el);
            setTimeout(() => el.remove(), 2000);
        }

        async showSpecialOverlay(text, color, duration = 2000, isSemiTransparent = false) {
            this.overlayEl.textContent = text;
            this.overlayEl.style.color = color;
            this.overlayEl.style.opacity = isSemiTransparent ? '0.7' : '1';
            this.inputLocked = true;
            
            return new Promise(resolve => {
                setTimeout(() => {
                    this.overlayEl.textContent = '';
                    this.inputLocked = false;
                    resolve();
                }, duration);
            });
        }

        async checkLevelAdvance() {
            if (this.score >= this.threshold) {
                await this.showSpecialOverlay("LEVEL COMPLETE!", "lightblue");
                this.level++;
                this.threshold += 50;
                this.score = 0;
                this.updateSidebar();
                this.fillBoard();
                this.render();
                this.initTokens(); // Refresh token styles
                
                await this.showSpecialOverlay(`BEGIN LEVEL ${this.level}`, "pink", 1500, true);
            }
        }

        updateSidebar() {
            this.scoreEl.textContent = this.score;
            this.levelEl.textContent = this.level;
            this.targetEl.textContent = this.threshold;
            
            if (this.score < 0) {
                this.scoreEl.classList.add('negative');
            } else {
                this.scoreEl.classList.remove('negative');
            }
        }

        getCellEl(r, c) {
            return this.boardEl.children[r * BOARD_SIZE + c];
        }

        checkGameOver() {
            for (let r = 0; r < BOARD_SIZE; r++) {
                for (let c = 0; c < BOARD_SIZE; c++) {
                    // Try swapping with right neighbor
                    if (c < BOARD_SIZE - 1) {
                        if (this.testSwap(r, c, r, c + 1)) return;
                    }
                    // Try swapping with bottom neighbor
                    if (r < BOARD_SIZE - 1) {
                        if (this.testSwap(r, c, r + 1, c)) return;
                    }
                }
            }
            this.showSpecialOverlay("NO MOVES - GAME OVER", "lightcoral");
        }

        testSwap(r1, c1, r2, c2) {
            const color1 = this.board[r1][c1];
            const color2 = this.board[r2][c2];
            this.board[r1][c1] = color2;
            this.board[r2][c2] = color1;
            const hasMatch = this.hasAnyMatch();
            this.board[r1][c1] = color1;
            this.board[r2][c2] = color2;
            return hasMatch;
        }

        resetGame() {
            this.score = 0;
            this.level = 1;
            this.threshold = 100;
            this.selected = null;
            this.inputLocked = false;
            this.chainMultiplier = 1;
            this.overlayEl.textContent = '';
            this.boardEl.classList.remove('red-border');
            this.init();
            this.initTokens();
            this.updateSidebar();
        }
    }

    // Initialize game
    window.onload = () => {
        const game = new Match3();
        game.initTokens();
    };
</script>
</body>
</html>
